[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alb-troubleshooter"
version = "0.1.0"
description = "Read-only diagnostics for AWS VPC traffipaths from an ALB to an application"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
]

[project.scripts]
alb-troubleshooter = "alb_troubleshooter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]